name: Collect named public facility coordinates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/geocode-public-facilities.cjs'
      - '.github/workflows/geocode-public-facilities.yml'
      - 'dist/facilities.json'
permissions:
  contents: write
  actions: write
concurrency:
  group: public-facility-coordinate-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate conservative place matching
        run: node --test tests/public-facilities.test.cjs tests/location-overrides.test.cjs
      - name: Collect unique facility and jurisdiction matches
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/geocode-public-facilities.cjs
      - name: Commit separate enrichment and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/location-overrides.json reports/public-facility-geocoding.json && test -z "$(git ls-files --others --exclude-standard reports/public-facility-geocoding.json)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/location-overrides.json reports/public-facility-geocoding.json
          git commit -m "Collect unique named public facility coordinates"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run static.yml --ref main
